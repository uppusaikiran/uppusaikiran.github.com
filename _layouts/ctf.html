---
layout: default
---

{% if page.url != "/" and site.breadcrumbs %}
  {% unless paginator %}
    {% include breadcrumbs.html %}
  {% endunless %}
{% endif %}

<style>
  /* ── Kill theme layout defaults ── */
  .ctf-wrap { float: none !important; width: 100% !important; padding-right: 0 !important; padding-left: 0 !important; }
  .ctf-wrap .page__inner-wrap { float: none !important; width: 100% !important; margin: 0 !important; }
  .ctf-wrap .page__content, .ctf-wrap .page__meta, .ctf-wrap .page__share { float: none !important; width: 100% !important; }
  #main { padding-left: 0; padding-right: 0; margin-top: 0; }

  /* ── Font stack ── */
  .ctf-hero, .ctf-body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ── Hero ── */
  .ctf-hero {
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: #f1f5f9;
    padding: 2.5rem 1.25rem 2rem;
    text-align: center;
  }
  .ctf-hero h1 {
    color: #fff; font-size: 28px; font-weight: 800;
    letter-spacing: -0.03em; margin: 0 0 0.4rem; line-height: 1.2;
  }
  .ctf-hero p {
    color: #94a3b8; font-size: 13px; margin: 0 auto;
    max-width: 480px; line-height: 1.55;
  }

  /* ── Pills ── */
  .ctf-pills {
    display: flex; flex-wrap: wrap; gap: 6px;
    justify-content: center; padding: 0; margin: 14px auto 0;
    max-width: 520px; list-style: none;
  }
  .ctf-pills a {
    display: inline-block; padding: 4px 10px;
    font-size: 11px; font-weight: 600; color: #cbd5e1;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 999px; text-decoration: none;
    transition: background 0.15s, color 0.15s;
  }
  .ctf-pills a:hover { background: rgba(255,255,255,0.15); color: #fff; }
  .ctf-pills .pill-sep { color: #334155; align-self: center; font-size: 10px; }

  /* ── Content column ── */
  .ctf-body {
    max-width: 680px; margin: 0 auto; padding: 24px 20px 40px;
    font-size: 14px; line-height: 1.65; color: #334155;
  }

  /* ── Headings ── */
  .ctf-body h2 {
    font-size: 20px !important; font-weight: 700 !important; color: #0f172a !important;
    margin: 36px 0 10px !important; padding-bottom: 6px !important;
    border-bottom: 1px solid #e2e8f0 !important; letter-spacing: -0.01em;
    line-height: 1.3 !important;
  }
  .ctf-body h3 {
    font-size: 16px !important; font-weight: 600 !important; color: #0f172a !important;
    margin: 24px 0 6px !important; padding-bottom: 0 !important; border-bottom: none !important;
    line-height: 1.35 !important;
  }
  .ctf-body h4 {
    font-size: 14px !important; font-weight: 600 !important; color: #1e293b !important;
    margin: 16px 0 4px !important; padding-bottom: 0 !important; border-bottom: none !important;
    line-height: 1.4 !important;
  }

  /* ── Body text ── */
  .ctf-body p { margin-bottom: 10px; font-size: 14px; }
  .ctf-body ul, .ctf-body ol { padding-left: 20px; margin: 6px 0 12px; }
  .ctf-body li { margin-bottom: 3px; font-size: 14px; }
  .ctf-body a { color: #2563eb; text-decoration: none; }
  .ctf-body a:hover { text-decoration: underline; }
  .ctf-body strong { color: #0f172a; font-weight: 600; }
  .ctf-body hr { border: none; height: 1px; background: #e2e8f0; margin: 28px 0; }

  /* ── Code ── */
  .ctf-body code {
    font-size: 12px; padding: 2px 5px; background: #f1f5f9;
    border-radius: 3px; color: #0f172a;
    font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }
  .ctf-body pre {
    margin: 12px 0; padding: 12px 16px;
    background: #0f172a; color: #e2e8f0; border-radius: 8px;
    overflow-x: auto; font-size: 12px; line-height: 1.55;
    border: 1px solid #1e293b;
  }
  .ctf-body pre code { background: none; padding: 0; color: inherit; font-size: inherit; border-radius: 0; }

  /* ── Tables ── */
  .ctf-body table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 13px; }
  .ctf-body th {
    text-align: left; padding: 6px 10px; font-weight: 600; font-size: 11px;
    color: #64748b; text-transform: uppercase; letter-spacing: 0.05em;
    background: transparent; border-bottom: 1px solid #e2e8f0;
  }
  .ctf-body td { padding: 6px 10px; border-bottom: 1px solid #f1f5f9; vertical-align: top; color: #334155; }
  .ctf-body tr:hover td { background: #f8fafc; }

  /* ── Cards ── */
  .ctf-card-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 8px; margin: 12px 0 16px;
  }
  .ctf-card {
    padding: 10px 12px; background: #fff;
    border: 1px solid #e2e8f0; border-radius: 8px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .ctf-card:hover { border-color: #94a3b8; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
  .ctf-card strong { display: block; font-size: 13px; color: #0f172a; margin-bottom: 2px; }
  .ctf-card span { display: block; font-size: 11px; color: #64748b; line-height: 1.35; }
  .ctf-card a, .ctf-card a:hover { color: inherit; text-decoration: none; }

  /* ── Steps ── */
  .ctf-steps { counter-reset: step; list-style: none; padding-left: 0; margin: 12px 0 16px; }
  .ctf-steps li {
    counter-increment: step; position: relative;
    padding: 6px 0 6px 36px;
    border-left: 2px solid #e2e8f0; margin-left: 10px;
    font-size: 13px;
  }
  .ctf-steps li::before {
    content: counter(step); position: absolute; left: -10px; top: 5px;
    width: 20px; height: 20px; background: #2563eb; color: #fff;
    border-radius: 50%; font-size: 10px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .ctf-steps li:last-child { border-left-color: transparent; }
  .ctf-steps li strong { color: #0f172a; }

  /* ── Callouts ── */
  .ctf-tip, .ctf-info, .ctf-warn {
    padding: 10px 14px; border-radius: 8px; margin: 12px 0;
    font-size: 13px; line-height: 1.55;
  }
  .ctf-tip { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; }
  .ctf-tip h4 { color: #15803d; margin: 0 0 3px !important; font-size: 13px !important; }
  .ctf-info { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; }
  .ctf-info h4 { color: #1d4ed8; margin: 0 0 3px !important; font-size: 13px !important; }
  .ctf-warn { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; }
  .ctf-warn h4 { color: #b45309; margin: 0 0 3px !important; font-size: 13px !important; }
  .ctf-tip pre, .ctf-info pre, .ctf-warn pre { font-size: 11px; margin: 8px 0 0; }

  /* ── Section index ── */
  .ctf-section-index {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 6px; list-style: none; padding: 0; margin: 12px 0;
  }
  .ctf-section-index a {
    display: block; padding: 8px 10px; background: #fff;
    border: 1px solid #e2e8f0; border-radius: 6px; color: #0f172a;
    font-weight: 600; font-size: 12px; text-decoration: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .ctf-section-index a:hover { border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37,99,235,0.08); text-decoration: none; }
  .ctf-section-index span { display: block; font-weight: 400; color: #64748b; font-size: 11px; margin-top: 2px; }

  /* ── Back to top ── */
  .ctf-backtop { text-align: center; margin: 24px 0 0; }
  .ctf-backtop a { font-size: 11px; color: #94a3b8; text-decoration: none; }
  .ctf-backtop a:hover { color: #2563eb; }

  /* ── Override theme notices ── */
  .ctf-body .notice, .ctf-body .notice--info, .ctf-body .notice--primary,
  .ctf-body .notice--success, .ctf-body .notice--warning, .ctf-body .notice--danger {
    border-radius: 8px; font-size: 13px !important;
  }

  /* ── Mobile ── */
  @media (max-width: 600px) {
    .ctf-hero { padding: 2rem 1rem 1.5rem; }
    .ctf-hero h1 { font-size: 22px; }
    .ctf-hero p { font-size: 12px; }
    .ctf-body { padding: 16px 12px 32px; }
    .ctf-card-grid, .ctf-section-index { grid-template-columns: 1fr 1fr; }
    .ctf-pills { gap: 4px; }
    .ctf-pills a { font-size: 10px; padding: 3px 8px; }
  }
  @media (max-width: 400px) {
    .ctf-card-grid, .ctf-section-index { grid-template-columns: 1fr; }
  }
</style>

<div id="main" role="main">
  <article class="page ctf-wrap" itemscope itemtype="http://schema.org/CreativeWork">
    {% if page.title %}<meta itemprop="headline" content="{{ page.title | markdownify | strip_html | strip_newlines | escape_once }}">{% endif %}
    {% if page.excerpt %}<meta itemprop="description" content="{{ page.excerpt | markdownify | strip_html | strip_newlines | escape_once }}">{% endif %}
    {% if page.date %}<meta itemprop="datePublished" content="{{ page.date | date: "%B %d, %Y" }}">{% endif %}

    <div class="page__inner-wrap">
      {{ content }}

      <footer class="page__meta" style="display:none;"></footer>
    </div>
  </article>
</div>
